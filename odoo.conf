[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; Detrás del balanceador de Google: confiar en X-Forwarded-*
proxy_mode = True
; No exponer el gestor de bases de datos
list_db = False
; Modo hilos (sin workers) para Cloud Run; subir si se necesita más concurrencia
workers = 0
log_level = info
